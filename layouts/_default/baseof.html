<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ .Site.Params.description }}">
  <style>
    :root {
      --bg: #fafafa;
      --text: #333;
      --accent: #0066cc;
      --border: #ddd;
      --card-bg: #fff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1a;
        --text: #e0e0e0;
        --accent: #4da6ff;
        --border: #444;
        --card-bg: #252525;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    header { margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
    header h1 a { color: var(--text); text-decoration: none; }
    nav { margin-top: 0.5rem; }
    nav a { color: var(--accent); margin-right: 1rem; text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    main { min-height: 60vh; }
    article { margin-bottom: 2rem; }
    article h2 a { color: var(--text); text-decoration: none; }
    article h2 a:hover { color: var(--accent); }
    .meta { color: #888; font-size: 0.9rem; margin-bottom: 0.5rem; }
    footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--border); color: #888; font-size: 0.9rem; }
    a { color: var(--accent); }
    h1, h2, h3 { line-height: 1.3; margin-bottom: 0.5rem; }
    p { margin-bottom: 1rem; }
    .post-list { list-style: none; }
    .post-list li { padding: 1rem; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 1rem; }
    .post-list h3 { margin-bottom: 0.25rem; }
    .post-list h3 a { text-decoration: none; color: var(--text); }
    .post-list h3 a:hover { color: var(--accent); }
    pre { background: var(--card-bg); padding: 1rem; overflow-x: auto; border-radius: 4px; border: 1px solid var(--border); }
    code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 0.9em; }
    img { max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <header>
    <h1><a href="/">{{ .Site.Title }}</a></h1>
    <nav>
      {{ range .Site.Menus.main }}
        <a href="{{ .URL }}">{{ .Name }}</a>
      {{ end }}
    </nav>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
    <p>&copy; {{ now.Year }} {{ .Site.Params.author }}. Built with <a href="https://gohugo.io">Hugo</a>.</p>
  </footer>
</body>
</html>
