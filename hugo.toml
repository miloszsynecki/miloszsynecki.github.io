baseURL = "https://miloszsynecki.github.io/"
languageCode = "en"
title = "Milosz Synecki"
theme = "hugo-coder"
defaultContentLanguage = "en"
enableEmoji = true

[pagination]
pagerSize = 6

[params]
  author = "Milosz Synecki"
  info = "Software Engineer"
  description = "Personal blog and portfolio"
  keywords = "blog,developer,personal"
  dateFormat = "January 2, 2006"
  since = 2026
  colorScheme = "auto"
  hideColorSchemeToggle = false

[menu]
  [[menu.main]]
    name = "Blog"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 2
  [[menu.main]]
    name = "Projects"
    url = "/projects/"
    weight = 3
  [[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 4

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"
  author = "authors"

[[params.social]]
  name = "GitHub"
  icon = "fa-brands fa-github fa-2x"
  weight = 1
  url = "https://github.com/miloszsynecki/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
